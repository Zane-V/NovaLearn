<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Learn</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="shortcut icon" href="{{url_for('static', filename='academic.png')}}" type="image/x-icon">
</head>
<body>
  {% include "_navbar.html" %}

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="toast-stack" aria-live="polite">
        {% for category, message in messages %}
          <div class="toast toast-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Auto-dismiss toast notifications after 4 seconds
    setTimeout(() => {
      document.querySelectorAll('.toast').forEach(t => {
        t.style.opacity = '0';
        t.style.transform = 'translateY(-8px)';
        setTimeout(() => t.remove(), 300);
      });
    }, 4000);

    const searchBox = document.getElementById('searchBox');
    const resultsList = document.getElementById('searchResults');

    if (searchBox && resultsList) {
        let timeout = null;

        searchBox.addEventListener('input', () => {
            clearTimeout(timeout);
            const query = searchBox.value.trim();

            timeout = setTimeout(async () => {
                if (!query) {
                    resultsList.style.display = 'none';
                    resultsList.innerHTML = '';
                    return;
                }

                const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const results = await res.json();

                if (results.length === 0) {
                    resultsList.style.display = 'none';
                    resultsList.innerHTML = '';
                    return;
                }

                resultsList.innerHTML = results.map(item => {
                    let link = item.type === 'course' ? `/course/${item.id}` : `/instructor/${item.id}`;
                    return `<li style="padding:5px; cursor:pointer;" onclick="window.location='${link}'">
                                ${item.name} (${item.type})
                            </li>`;
                }).join('');

                resultsList.style.display = 'block';
            }, 250); // debounce 250ms
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchBox.contains(e.target) && !resultsList.contains(e.target)) {
                resultsList.style.display = 'none';
            }
        });
    }
    </script>

</body>
</html>
