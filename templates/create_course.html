  {% extends "base.html" %}
  {% block content %}

<h2>Create a New Course</h2>
<div class="form-card">
<form method="POST" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <input type="text" name="title" placeholder="Course Title" required><br><br>

  <textarea name="description" placeholder="Short Description" required></textarea><br><br>

  <div class="form-grid">
    <div>
      <label style="font-size:.85rem; color:#556;">Category</label><br>
      <select name="category" required>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label style="font-size:.85rem; color:#556;">Level</label><br>
      <select name="level" required>
        {% for lvl in levels %}
        <option value="{{ lvl }}">{{ lvl|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <br>

  <textarea name="content" placeholder="Write full course content here..." rows="8" cols="50" required></textarea><br><br>

  <input type="file" name="image" accept="image/*" required><br><br>
  <button type="submit">Create</button>
</form>
</div>

  {% endblock %}
