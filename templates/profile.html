{% extends "base.html" %}
{% block content %}

<h2>My Profile</h2>
<div class="profile" style="display: flex; gap: 15px; flex-direction: column; max-width: 430px;">
  <div class="stat"><b>Username:</b> {{ user.username }}</div>
  <div class="stat"><b>Role:</b> {{ user.role }}</div>
</div>

<form action="{{ url_for('delete_account') }}" method="POST"
      onsubmit="return confirm('Delete your account and all your data? This cannot be undone.');"
      style="max-width:430px; margin-top:18px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" style="background: crimson;">
    Delete Account
  </button>
</form>
{% endblock %}
